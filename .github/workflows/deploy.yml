# Mise en ligne automatique chez one.com
#
# À chaque modification enregistrée sur GitHub (branche main), GitHub :
#   1. installe et compile le site (npm run build),
#   2. envoie le dossier dist/ chez one.com par SFTP.
#
# Réglages à faire une seule fois sur GitHub : Settings → Secrets and variables → Actions → New repository secret
#   SFTP_HOST      adresse du serveur SFTP donnée par one.com
#   SFTP_USER      identifiant SFTP
#   SFTP_PASSWORD  mot de passe SFTP
#   SFTP_DIR       dossier du site sur le serveur (ex. /www ou /) — voir l'étape « Contenu du serveur » dans les journaux
#
# On peut aussi lancer la mise en ligne à la main : onglet Actions → « Mise en ligne » → Run workflow.

name: Mise en ligne

on:
  push:
    branches: [main]
    paths-ignore:
      - 'studio/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOSSIER_RENSEIGNE: ${{ secrets.SFTP_DIR != '' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le site
        run: npm run build

      - name: Installer l'outil d'envoi (lftp)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Contenu du serveur (pour vérifier le dossier)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.SFTP_DIR }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 2; echo '--- racine :'; cls -la /; echo '--- dossier du site :'; cls -la '${SFTP_DIR:-.}'; quit"

      - name: Envoyer le site chez one.com
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.SFTP_DIR }}
        # Sans --delete : on ajoute et remplace les fichiers du site, on ne supprime jamais rien sur le serveur
        # (l'ancien WordPress éventuellement présent reste intact).
        run: |
          if [ -z "$SFTP_DIR" ]; then
            echo "::warning::Le secret SFTP_DIR n'est pas encore renseigné : rien n'a été envoyé. Regardez l'étape « Contenu du serveur » pour trouver le dossier du site, puis ajoutez SFTP_DIR."
            exit 0
          fi
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror --reverse --verbose --parallel=4 dist/ '$SFTP_DIR'; quit"

      - name: Vérifier le site en ligne
        if: env.DOSSIER_RENSEIGNE == 'true'
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" https://3paroisses-lyon5-tassin.eu/bapteme)
          echo "Réponse de https://3paroisses-lyon5-tassin.eu/bapteme : $code"
          curl -s https://3paroisses-lyon5-tassin.eu/ | grep -q 'id="root"' && echo "✅ Le nouveau site est en ligne." || echo "⚠️ La page d'accueil ne semble pas être le nouveau site (WordPress encore actif ?)."
